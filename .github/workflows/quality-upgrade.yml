name: Upgrade tweets quality gate

on:
  push:
    branches: [ai/product-completion/tweets]
    paths:
      - .github/workflows/quality-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai/product-completion/tweets
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Add explicit Next.js lint boundary
        run: |
          npm install --save-dev --save-exact eslint@9.39.5 eslint-config-next@16.3.5
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.scripts = { ...pkg.scripts, lint: 'eslint . --max-warnings=0' }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          fs.writeFileSync('eslint.config.mjs', `import { defineConfig, globalIgnores } from 'eslint/config'\nimport nextVitals from 'eslint-config-next/core-web-vitals'\n\nconst eslintConfig = defineConfig([\n  ...nextVitals,\n  globalIgnores(['.next/**', 'node_modules/**']),\n])\n\nexport default eslintConfig\n`)
          NODE
      - name: Audit full dependency graph
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit verified lint and tooling state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json eslint.config.mjs
          if git diff --cached --quiet; then
            echo 'No quality-gate changes to commit'
            exit 0
          fi
          git commit -m 'ci: add verified tweets lint and full audit gate'
          git push origin HEAD:ai/product-completion/tweets
