name: Security migration

on:
  push:
    branches: [portfolio-improvements-2026-08]
    paths:
      - .github/workflows/security-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade patched runtime and audited transitives
        run: |
          npm install --save-exact next@15.5.24 react@18.2.0 react-dom@18.2.0
          node <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.engines = { node: '22.x' }
          pkg.overrides = {
            ...(pkg.overrides || {}),
            nanoid: '3.3.18',
            postcss: '8.5.23',
            prismjs: '1.30.0',
            trim: '0.0.3'
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only
          npm ci
      - run: node --test tests/*.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Commit only verified dependency state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: upgrade static tweet security boundary'
          git push origin HEAD:portfolio-improvements-2026-08
